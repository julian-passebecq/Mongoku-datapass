name: Datapass Debug CI

on:
  push:
    branches:
      - datapass/control-plane-v1
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Print formatted legacy adapter
        run: pnpm prettier src/lib/datapass/legacyGlobalAdapter.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build app
        run: pnpm build:app

      - name: Build CLI
        run: pnpm build:cli
