name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/components/ProjectRail.svelte src/lib/server/reportEngine.ts
      - run: git diff --no-color -- src/lib/components/ProjectRail.svelte src/lib/server/reportEngine.ts
