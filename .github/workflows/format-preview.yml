name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec prettier --write src/routes/+page.svelte src/routes/workspace-states/+page.svelte
      - name: Show exact formatter diff
        run: git diff --no-color -- src/routes/+page.svelte src/routes/workspace-states/+page.svelte
