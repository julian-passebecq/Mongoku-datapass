name: Refresh pnpm lockfile

on:
  push:
    branches:
      - datapass/control-plane-v1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: datapass/control-plane-v1
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Regenerate lockfile with pinned pnpm
        run: |
          pnpm --version
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(ci): regenerate pnpm lockfile"
          git push origin HEAD:datapass/control-plane-v1
