name: Apply ESLint fixes

on:
  push:
    branches:
      - datapass/control-plane-v1

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: datapass/control-plane-v1
          fetch-depth: 0
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply ESLint safe fixes
        run: pnpm lint:fix || true
      - name: Reformat fixes
        run: pnpm format
      - name: Commit deterministic lint fixes
        run: |
          if git diff --quiet; then
            echo "No autofixes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply eslint autofixes"
          git push origin HEAD:datapass/control-plane-v1
